<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nómina Stellantis PRO</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-body: #050505; --bg-panel: #111111; --text-main: #ffffff;
            --color-noche: #2979ff; --color-festivo: #ff1744; --color-vacaciones: #00e676;
            --color-convenio: #ffea00; --color-adecuacion: #00b0ff; 
            --color-descanso: #1a1a1a; --color-extra: #ff9100; --color-total: #00e676; --color-bolsa: #ffd700;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Roboto Condensed", "Arial Narrow", sans-serif;
            background-color: var(--bg-body); color: var(--text-main);
            margin: 0; padding: 0; height: 100vh; height: 100dvh;
            display: flex; justify-content: center; overflow: hidden;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        #app-container {
            width: 100%; max-width: 600px; height: 100%;
            display: flex; flex-direction: column;
            background-color: var(--bg-body); border-left: 1px solid #222; border-right: 1px solid #222;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem 1rem; background: var(--bg-panel); border-bottom: 1px solid #333; flex-shrink: 0; height: 60px;
        }
        h2 { margin: 0; color: #fff; text-transform: uppercase; font-weight: 900; font-size: clamp(1.2rem, 5vw, 1.8rem); cursor:pointer;}
        .btn-nav, .btn-config {
            background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
        }
        .btn-nav { font-size: 1.5rem; font-weight: 900; }
        .btn-config { font-size: 1.2rem; margin-left: 8px; }

        .mini-stats {
            display: grid; grid-template-columns: repeat(6, 1fr); padding: 8px 2px;
            background: #000; border-bottom: 1px solid #222; font-size: 0.7rem; flex-shrink: 0; text-align: center;
        }
        .stat-item { color: #bbb; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; border-right: 1px solid #222; min-width: 50px;}
        .stat-item:last-child { border-right: none; }
        .stat-label { font-size: 0.45rem; margin-bottom: 2px; text-transform: uppercase; color: #888; }
        .stat-val { font-size: 0.85rem; color: #fff; }

        .calendar-container { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; background: #000; }
        .week-days {
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
            color: #666; font-weight: 900; padding: 10px 0 5px 0; background: #000; font-size: 0.75rem;
            position: sticky; top: 0; z-index: 10;
        }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 5px; }
        .day-cell {
            background-color: var(--color-descanso); min-height: 75px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; position: relative;
        }
        .day-num { font-size: 1.4rem; font-weight: 900; color: #666; line-height: 1; }
        .day-label { font-size: 0.55rem; font-weight: 900; color: #444; text-transform: uppercase; margin-top: 4px;}
        
        .day-cell.noche { background-color: var(--color-noche); }
        .day-cell.noche .day-num, .day-cell.noche .day-label { color: #fff; }
        .day-cell.festivo { background-color: var(--color-festivo); }
        .day-cell.festivo .day-num, .day-cell.festivo .day-label { color: #fff; }
        .day-cell.vacaciones { background-color: var(--color-vacaciones); }
        .day-cell.convenio { background-color: var(--color-convenio); }
        .day-cell.adecuacion { background-color: var(--color-adecuacion); }
        .day-cell.today { border: 2px solid #fff; box-shadow: 0 0 10px var(--color-adecuacion); }

        .badge-extra { position: absolute; top: 2px; right: 3px; background: var(--color-extra); color: #000; font-size: 0.55rem; font-weight: 900; padding: 1px 3px; border-radius: 3px; }

        .leyenda { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 8px; background: #080808; border-top: 1px solid #222; flex-shrink: 0; font-size: 0.65rem; color: #888; text-transform: uppercase; font-weight: bold; }

        .resumen-panel {
            background: var(--bg-panel); border-top: 1px solid #333; padding: 12px; flex-shrink: 0;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center;
        }
        .res-box { display: flex; flex-direction: column; }
        .res-lab { font-size: 0.55rem; color: #666; text-transform: uppercase; font-weight: 900; margin-bottom: 2px; }
        .res-val { font-size: 1.1rem; font-weight: 900; color: #fff; }
        .btn-add-horas-main { grid-column: 1 / -1; background: #222; color: var(--color-extra); border: 1px solid #444; padding: 8px; border-radius: 6px; font-weight: 900; margin-top: 8px; cursor: pointer; text-transform: uppercase; font-size: 0.75rem;}

        /* MODALES */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: flex-start; padding: 10px; overflow-y: auto;}
        .modal-content { background: #1e1e1e; padding: 15px; border-radius: 12px; width: 100%; max-width: 500px; color: #fff; margin-top: 20px;}
        .config-row { margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .config-row label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #aaa; }
        .config-row input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-weight: bold;}
        .tabs { display: flex; gap: 2px; margin-bottom: 15px; border-bottom: 1px solid #333;}
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; background: #222; font-size: 0.65rem; font-weight: bold; border-radius: 5px 5px 0 0;}
        .tab.active { background: #1e1e1e; color: var(--color-noche); border-bottom: 2px solid var(--color-noche); }
        .tab-content { display: none; } .tab-content.active { display: block; }

        .nomina-sheet { background: #fff; color: #000; padding: 15px; border-radius: 4px; margin-top: 10px; font-family: monospace; }
        .nom-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }

        /* MODO HORIZONTAL (LANDSCAPE) - OCULTA TODO EXCEPTO CALENDARIO */
        @media (orientation: landscape) {
            .mini-stats, .leyenda, .resumen-panel { display: none !important; }
            #app-container { max-width: 100%; }
            .day-cell { min-height: 100px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="header">
            <button class="btn-nav" onclick="cambiarMes(-1)">❮</button>
            <h2 id="mesTitulo" onclick="irAHoy()">ENERO 2026</h2>
            <div style="display:flex;">
                <button class="btn-nav" onclick="cambiarMes(1)">❯</button>
                <button class="btn-config" onclick="descargarCopia()">💾</button>
                <button class="btn-config" onclick="abrirConfig()">⚙️</button>
            </div>
        </div>

        <div class="mini-stats">
            <div class="stat-item"><span class="stat-label">H. TRAB</span><span class="stat-val" id="statHorasTrabajadas">0h</span></div>
            <div class="stat-item"><span class="stat-label" style="color:var(--color-extra)">EXTRAS</span><span class="stat-val" id="statHorasExtra">0h</span></div>
            <div class="stat-item"><span class="stat-label">CONV</span><span class="stat-val" id="statConvenio">0</span></div>
            <div class="stat-item"><span class="stat-label">ADEC</span><span class="stat-val" id="statAdecuacion">0</span></div>
            <div class="stat-item"><span class="stat-label">VAC</span><span class="stat-val" id="statVacaciones">0</span></div>
            <div class="stat-item"><span class="stat-label" style="color:var(--color-bolsa)">BOLSA</span><span class="stat-val" id="statBolsa">0h</span></div>
        </div>

        <div class="calendar-container">
            <div class="week-days">
                <div>LUN</div><div>MAR</div><div>MIE</div><div>JUE</div><div>VIE</div><div>SAB</div><div>DOM</div>
            </div>
            <div class="calendar-grid" id="diasContainer"></div>
        </div>

        <div class="leyenda">
            <span><b style="color:var(--color-noche)">●</b> NOCHE</span>
            <span><b style="color:var(--color-festivo)">●</b> FEST</span>
            <span><b style="color:var(--color-vacaciones)">●</b> VAC</span>
            <span><b style="color:var(--color-convenio)">●</b> CONV</span>
            <span><b style="color:var(--color-adecuacion)">●</b> ADEC</span>
        </div>

        <div class="resumen-panel">
            <div class="res-box"><span class="res-lab">TRABAJADOS</span><span class="res-val" id="resTrabajados">0</span></div>
            <div class="res-box"><span class="res-lab" style="color:var(--color-noche)">NOCHES</span><span class="res-val" id="resNoches">0</span></div>
            <div class="res-box"><span class="res-lab" style="color:var(--color-festivo)">FESTIVOS</span><span class="res-val" id="resFestivos">0</span></div>
            <div class="res-box"><span class="res-lab">LIBRES</span><span class="res-val" id="resLibres">0</span></div>
            <button class="btn-add-horas-main" onclick="abrirExtraModal()">⏱️ ANOTAR HORAS EXTRA</button>
        </div>
    </div>

    <div id="configModal" class="modal">
        <div class="modal-content">
            <button style="float:right; background:none; border:none; color:#fff; font-size:1.5rem;" onclick="cerrarConfig()">&times;</button>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('tab-nomina')">NÓMINA</div>
                <div class="tab" onclick="switchTab('tab-precios')">PRECIOS</div>
                <div class="tab" onclick="switchTab('tab-turnos')">TURNOS</div>
                <div class="tab" onclick="switchTab('tab-datos')">DATOS</div>
            </div>

            <div id="tab-nomina" class="tab-content active">
                <select id="nominaMonthSelector" style="width:100%; padding:10px; margin-bottom:10px; background:#333; color:#fff; border:1px solid #555;" onchange="renderNominaDetallada()"></select>
                <div class="nomina-sheet">
                    <div id="nominaBody"></div>
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.1rem; color:#d32f2f; margin-top:10px; border-top:2px solid #000; padding-top:10px;">
                        <span>NETO ESTIMADO:</span><span id="nomNeto">0,00 €</span>
                    </div>
                </div>
