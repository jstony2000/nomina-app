<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,
initial-scale=1.0">
<title>Nómina V49 FULL</title>
<style>
:root { --b: #121212; --p: #1e1e1e; --bl: #2196F3; --g:

#4CAF50; --r: #F44336; --t: #fff; }

body { background: var(--b); color: var(--t); font-family:

sans-serif; margin: 0; }

.hd { display: flex; justify-content: space-between;
background: #000; padding: 15px; align-items: center; }
.hd button { background: #333; color: #fff; border: 0;
padding: 10px 15px; border-radius: 4px; font-size: 1.2em; cursor:
pointer; }

.cg { display: grid; grid-template-columns: repeat(7, 1fr);

gap: 6px; padding: 15px; }

.dc { background: #333; border-radius: 6px; padding: 25px
0; text-align: center; font-weight: bold; cursor: pointer; }

.noche { background: var(--bl); }
.festivo { background: var(--r); }
.vacacion { background: var(--g); }
.pn { background: var(--p); padding: 20px; margin: 15px;

border-radius: 8px; }

.fl { display: flex; justify-content: space-between;

padding: 8px 0; border-bottom: 1px solid #333; }

.mod { display: none; position: fixed; top: 0; background:

rgba(0,0,0,.8); width: 100%; height: 100%; z-index: 100; }
.mc { background: var(--p); padding: 25px; margin: 50px

auto; width: 80%; border-radius: 8px; }

input { width: 100%; padding: 12px; margin: 8px 0 15px;
background: #333; color: #fff; border: 0; box-sizing: border-box; }
</style>
</head>
<body>
<div class="hd">

<button onclick="cM(-1)">◀</button>
<div style="text-align:center">
<h3 id="mt" style="margin:0;font-size:1.3em"></h3>
<small id="st" style="color:var(--g)"></small>
</div>
<button onclick="cM(1)">▶</button>
<button onclick="m(1)">⚙</button>
</div>
<div class="cg" id="cg"></div>
<div class="pn" id="dp"></div>
<div class="mod" id="md">
<div class="mc">
<h3 style="margin-top:0">Ajustes del Mes</h3>
Fijos (KEA, K70) €: <input id="iF" type="number"

step="0.01">

Paga Extra/Atrasos €: <input id="iE" type="number"

step="0.01">

% IRPF+SS (Ej: 0.2705): <input id="iR" type="number"

step="0.0001">

<button onclick="m(0)"

style="width:100%;padding:15px;background:var(--r);color:#fff;borde
r:0;font-weight:bold;cursor:pointer;">GUARDAR DATOS</button>

</div>
</div>
<script>
let a = 2026, ms = 4, db =

JSON.parse(localStorage.getItem('nDB')) || {};

const msN = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO",
"JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE",
"DICIEMBRE"];

function iM() {
let k = a + '-' + ms;
if (!db[k]) db[k] = { d: Array(31).fill('libre'), f:

32.71, e: ms === 4 ? 2516.37 : 0, r: 0.2703 };

rUI();
}
function sv() {
localStorage.setItem('nDB', JSON.stringify(db));
rUI();
}
function cM(d) {
ms += d;
if (ms > 11) { ms = 0; a++; }

if (ms < 0) { ms = 11; a--; }
iM();
}
function rD(i) {
let e = ['libre', 'noche', 'festivo', 'vacacion'], k =

a + '-' + ms;

db[k].d[i] = e[(e.indexOf(db[k].d[i]) + 1) % 4];
sv();
}
function m(o) {
let k = a + '-' + ms;
if (o) {
document.getElementById('iF').value = db[k].f;
document.getElementById('iE').value = db[k].e;
document.getElementById('iR').value = db[k].r;
document.getElementById('md').style.display =

'block';

} else {
db[k].f =

parseFloat(document.getElementById('iF').value) || 0;

db[k].e =

parseFloat(document.getElementById('iE').value) || 0;

db[k].r =

parseFloat(document.getElementById('iR').value) || 0;

document.getElementById('md').style.display =

'none';

sv();
}
}
function rUI() {
let k = a + '-' + ms, dt = db[k], mc = (ms + 1) % 12,

ac = mc === 0 ? a + 1 : a;

document.getElementById('mt').innerText = `COBRO EN

${msN[mc]} ${ac}`;

document.getElementById('st').innerText = `(Trabajo:

${msN[ms]})`;

let g = document.getElementById('cg');
g.innerHTML = '';
let n = 0, f = 0, v = 0, dd = new Date(a, ms + 1,

0).getDate();

for (let i = 0; i < dd; i++) {
let s = dt.d[i];
if (s === 'noche') n++;
if (s === 'festivo') f++;
if (s === 'vacacion') v++;

g.innerHTML += `<div class="dc ${s}"

onclick="rD(${i})">${i + 1}</div>`;

}
let dg = Math.max(0, 30 - v),
t6 = dg * 83.879,
t7 = v * 83.879,
t0 = n * 7.75 * 3.1517,
t5 = n * 3.75 * 2.2909,
t9 = f * 7.75 * 7.9452,
dev = t6 + t7 + t0 + t5 + t9 + dt.f + dt.e,
ded = dev * dt.r,
lq = dev - ded;
document.getElementById('dp').innerHTML = `
<div class="fl"><span>G60 Base
(${dg}d)</span><span>${t6.toFixed(2)} €</span></div>

${v > 0 ? `<div class="fl"
style="color:var(--g)"><span>G70 Vacaciones
(${v}d)</span><span>${t7.toFixed(2)} €</span></div>` : ''}

<div class="fl"><span>K05

Nocturnidad</span><span>${t0.toFixed(2)} €</span></div>

<div class="fl"><span>K75

Garantía</span><span>${t5.toFixed(2)} €</span></div>

<div class="fl"><span>KA9

Festivos</span><span>${t9.toFixed(2)} €</span></div>
<div class="fl"><span>Fijos (KEA,
K70)</span><span>${dt.f.toFixed(2)} €</span></div>
${dt.e > 0 ? `<div class="fl"

style="color:var(--g)"><span>T00
Extra/Atrasos</span><span>${dt.e.toFixed(2)} €</span></div>` : ''}
<div class="fl" style="margin-top:10px"><b>TOTAL

DEVENGADO</b><b>${dev.toFixed(2)} €</b></div>

<div class="fl" style="color:var(--r)"><span>IRPF +

SS</span><span>-${ded.toFixed(2)} €</span></div>

<div class="fl"

style="color:var(--bl);font-size:1.3em;margin-top:5px"><b>LÍQUIDO A
PERCIBIR</b><b>${lq.toFixed(2)} €</b></div>

`;
}
window.onload = iM;
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('./sw.js')
.then(reg => console.log('Service Worker OK',

reg))

.catch(err => console.error('Service Worker

Error', err));
});
}
</script>
</body>
</html>
